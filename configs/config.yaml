# Log Analyzer configuration for the sample environment (data/sample/*.txt).
#
# Every key is optional: anything omitted falls back to the built-in defaults
# (src/log_analyzer/config/schema.py for scalars, src/log_analyzer/config/defaults.yaml for
# the pattern library, metric extractors, the two alert rules from the problem statement and
# the noise filters). Unknown keys are rejected, so typos fail loudly.
#
# Sections may live under `analyzer:` (as in the problem statement) or at the top level.
# Durations accept seconds (60) or strings ("60s", "5m", "1h").

analyzer:
  # --------------------------------------------------------------------- time windows
  windows:
    error_rate_baseline: 300   # learn each service's normal error rate over 5 minutes
    alert_grouping: 60         # an incident stays open while related signals keep arriving
    pattern_detection: 30      # cascade window: failures this close together form a chain
    error_rate_current: 60     # "now" window compared against the baseline
    latency_trend: 30m         # max age of latency samples used for trend detection
    alert_cooldown: 15m        # a recurring detector condition re-opens its alert instead of re-paging
    noise_hold: 15m            # broad "no common cause" noise stays active this long after its last spike
    bucket_seconds: 5          # resolution of the error-rate ring buffers
    dashboard: 5m              # live dashboard window when reading a stream

  # ----------------------------------------------------------------------- thresholds
  thresholds:
    error_rate_multiplier: 3          # spike when current rate >= 3x baseline ...
    error_rate_absolute_percent: 10   # ... or >= 10% absolute
    min_occurrences: 3                # the same error must repeat 3x within alert_grouping
    min_baseline_events: 20           # below this, the configured expected_error_rate is the baseline
    default_expected_error_rate: 1.0  # percent, for services not listed below
    performance_degradation_ms: 1000  # hard latency threshold: HIGH above it, MEDIUM trend alerts before it
    latency_degradation_ratio: 2.0    # newest samples must be 2x the baseline median ...
    latency_sustained_fraction: 0.7   # ... for 70% of them ...
    latency_trend_min_tau: 0.5        # ... while rising monotonically (Kendall tau) ...
    latency_trend_min_z: 2.3          # ... with statistical significance (Mann-Kendall z, p~0.01)
    latency_floor_ms: 100             # ignore "degradations" that stay this fast
    latency_window_samples: 20
    latency_min_samples: 4
    latency_max_samples: 64
    saturation_warning_ratio: 0.8     # pool >= 80% and rising -> MEDIUM early warning (with ETA)
    saturation_critical_ratio: 0.95   # pool >= 95% -> HIGH
    cascade_min_services: 3           # services in a failure chain before it is a cascade
    noise_diversity_ratio: 0.5        # unexplained, heterogeneous errors are capped at MEDIUM
    min_alert_severity: MEDIUM        # LOW-only incidents (retries, 4xx noise) never page

  # ---------------------------------------------------------- services and topology
  # `dependencies` serve two purposes:
  #   * root cause analysis: which way failures propagate
  #   * evidence validation: a log line claiming "order-service failed calling api-gateway"
  #     is ignored for correlation because order-service does not depend on the gateway.
  #     (The sample data's random noise contains many such impossible claims.)
  # `aliases` let free-text messages name a service ("Payment provider unavailable").
  # `expected_error_rate` is a percentage and acts as a floor for the learned baseline.
  services:
    - name: api-gateway
      critical: true
      dependencies: [auth-service, payment-service, inventory-service, order-service,
                     user-service, search-service, recommendation-service, notification-service]
      expected_error_rate: 0.1
    - name: web-app
      critical: true
      dependencies: [api-gateway, payment-service, order-service]
      expected_error_rate: 0.5
    - name: payment-service
      critical: true
      dependencies: [database, payment-provider]
      expected_error_rate: 0.05
      aliases: [payment]
    - name: payment-provider          # third-party API
      critical: true
      expected_error_rate: 0.5
      aliases: ["payment provider", "payment gateway"]
    - name: order-service
      critical: true
      dependencies: [database, payment-service, inventory-service]
      expected_error_rate: 0.1
      aliases: [order]
    - name: inventory-service
      dependencies: [database]
      expected_error_rate: 0.1
      aliases: [inventory]
    - name: user-service
      dependencies: [database]
      expected_error_rate: 0.1
    - name: auth-service
      critical: true
      dependencies: [database, user-service]
      expected_error_rate: 0.1
    - name: search-service
      dependencies: [database]
      expected_error_rate: 0.5
    - name: recommendation-service
      dependencies: [database, search-service]
      expected_error_rate: 1.0
    - name: notification-service
      dependencies: [database]
      expected_error_rate: 1.0
    - name: analytics-service
      dependencies: [database]
      expected_error_rate: 1.0
    - name: database
      critical: true
      expected_error_rate: 0.01
      aliases: [db]

  # ---------------------------------------------------------------- noise filtering
  ignore_patterns:                    # regexes matched against the raw line
    - "Health check endpoint"
    - "Metrics collection"
    - "DEBUG.*development"
  filters:
    min_level: INFO                   # drop DEBUG/TRACE
    ignore_services: ["dev-*", "localhost", "test-*", "debug-*"]   # glob patterns

  # ------------------------------------------------------------------------ parsers
  parsers:
    enabled: [otel, json, text, app]   # otel = OpenTelemetry OTLP/JSON log records
    default_timezone: UTC             # for timestamps without an offset
    # The Monolog/Laravel-style lines ("[ts] production.ERROR: ...") carry no service name.
    # They come from the customer-facing web application in this environment.
    app_channel_services: {production: web-app}
    app_default_service: app

  # ---------------------------------------------------------------- alert rules
  # Merged by name with the built-ins (the two rules from the problem statement).
  # Predicates: pattern, service, root_cause, category, cascade, affected_services,
  # error_count, unique_errors, error_rate, duration, severity.
  alert_rules:
    - name: "Database Connection Crisis"
      condition:
        all:
          - pattern: "connection pool exhausted"
          - affected_services: ">3"
      severity: CRITICAL
      auto_escalate: true
      actions:
        - "Page the database on-call; check pool size, max_connections and long-running queries"

    - name: "API Gateway Cascade"
      condition:
        all:
          - service: "api-gateway"
          - error_rate: ">5%"
          - duration: ">60s"
      severity: HIGH

  # ------------------------------------------------------------------- correlation
  correlation:
    inhibit_during_unexplained: true  # fold weak alerts into an active "no common cause" alert
    rca_weights: {reach: 0.45, precedence: 0.25, intrinsic: 0.30}

  # ------------------------------------------------------------------------ output
  output:
    max_sample_logs: 5
    max_evidence: 6
    max_actions: 5
    max_trend_rows: 15
    refresh_seconds: 5                # live dashboard refresh when reading a stream
    color: auto                       # auto | always | never (NO_COLOR is honoured)

  api:
    host: 0.0.0.0
    port: 8080
    max_body_bytes: 10485760
    max_lines: 200000

  # Hard caps that bound memory regardless of input size or cardinality.
  limits:
    max_tracked_keys: 10000
    max_open_incidents: 1000
    max_request_ids: 10000
    max_fingerprints: 2000
    max_retained_alerts: 5000
    max_timeline_buckets: 1440
