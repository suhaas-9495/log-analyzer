name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make install PYTHON=python
      - name: Lint, type check, test (coverage >= 85%)
        run: make check
      - name: Build wheel and sdist
        run: make build
      - name: Analyze the provided samples
        run: make report
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sample-reports
          path: reports/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test inside the image build
        run: docker build --target test -t log-analyzer:test .
      - name: Build runtime image
        run: docker build -t log-analyzer:latest .
      - name: Smoke test
        run: docker run --rm log-analyzer:latest --file /app/data/sample/test_logs.txt --format json | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['statistics']['alerts_generated'] >= 3"
